name: Feature request
description: Suggest an improvement to a BlueConfetti app.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Issues here are public. Describe the idea without confidential details from your organization.
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - Table Glide
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem the feature would help with.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you picture it working.
